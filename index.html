
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jQuery Practice</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        /* Task 2 */
        #message {
            display: none;
            padding: 15px;
            margin: 15px 0;
            background: #d4edda;
            color: #155724;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        /* Instagram Post */
        .instagram-post {
            width: 400px;
            max-width: 100%;
            margin: 30px auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .instagram-post img {
            width: 100%;
            display: block;
        }

        .caption {
            padding: 15px;
            font-size: 16px;
        }

        /* Menu */
        .menu {
            margin-top: 30px;
        }

        .menu-item {
            padding: 15px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>jQuery Practice</h1>

    <!-- =========================
         TASK 2
    ========================== -->

    <h2>1. Show Hidden Message</h2>

    <button id="showBtn">Show Message</button>

    <div id="message">
        🎉 Hello! This message was hidden and is now visible using jQuery.
    </div>


    <!-- =========================
         TASK 3
    ========================== -->

    <h2>2. Instagram Style Post</h2>

    <div class="instagram-post">

        <img
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80"
            alt="Instagram Post"
        >

        <div id="caption" class="caption">
            ❤️ Enjoying a beautiful day!  
            #instagram #photography #beautiful
        </div>

        <div style="padding: 10px;">
            <button id="hideCaption">Hide Caption</button>
            <button id="showCaption">Show Caption</button>
        </div>

    </div>


    <!-- =========================
         TASK 4
    ========================== -->

    <h2>3. Menu Items</h2>

    <div class="menu">

        <div class="menu-item">
            🍕 Pizza
        </div>

        <div class="menu-item">
            🍔 Burger
        </div>

        <div class="menu-item">
            🍟 French Fries
        </div>

        <div class="menu-item">
            🥤 Cold Drink
        </div>

    </div>

</div>


<script>

    // Wait until the HTML document is completely loaded
    $(document).ready(function () {

        // =====================================
        // TASK 2
        // Select #showBtn and add click event
        // =====================================

        $('#showBtn').click(function () {

            $('#message').show();

        });


        // =====================================
        // TASK 3
        // Hide Instagram Caption
        // =====================================

        $('#hideCaption').click(function () {

            $('#caption').hide();

        });


        // =====================================
        // TASK 3
        // Show Instagram Caption
        // =====================================

        $('#showCaption').click(function () {

            $('#caption').show();

        });


        // =====================================
        // TASK 4
        // Select all .menu-item elements
        // and change background color
        // =====================================

        $('.menu-item').css('background-color', '#f5f5f5');

    });

</script>

</body>
</html>
